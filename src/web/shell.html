<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#111114" />
    <title>lcr · Local code review</title>
    <link rel="stylesheet" href="./styles/index.css" />
    <!-- Bun's CSS parser does not support ::highlight yet. Inline rules pass through to the browser. -->
    <style>
      ::highlight(lcr-selection) {
        background: color-mix(in srgb, var(--primary) 45%, transparent);
        color: var(--foreground);
      }
      ::highlight(lcr-notes) {
        background-color: #f59e0b33;
        text-decoration: underline #f59e0b;
      }
      ::highlight(lcr-word-add) {
        background-color: #22c55e33;
      }
      ::highlight(lcr-word-del) {
        background-color: #f43f5e33;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./client/app/index.tsx"></script>
  </body>
</html>
