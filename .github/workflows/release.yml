name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out tag
        uses: actions/checkout@v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build release archives
        run: |
          mkdir -p build dist

          package_target() {
            local target="$1" executable="$2" archive="$3"
            bun run build -- --target="$target" --outfile "build/$executable"
            if [[ "$archive" == *.zip ]]; then
              (cd build && zip "../dist/$archive" "$executable")
            else
              chmod +x "build/$executable"
              tar -C build -czf "dist/$archive" "$executable"
            fi
          }

          package_target bun-linux-x64 lcr lcr-linux-x64.tar.gz
          package_target bun-linux-arm64 lcr lcr-linux-arm64.tar.gz
          package_target bun-darwin-x64 lcr lcr-macos-x64.tar.gz
          package_target bun-darwin-arm64 lcr lcr-macos-arm64.tar.gz
          package_target bun-windows-x64 lcr.exe lcr-windows-x64.zip

          cd dist
          for archive in *.tar.gz *.zip; do
            sha256sum "$archive" > "$archive.sha256"
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
