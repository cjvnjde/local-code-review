name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and attach executable
    runs-on: ubuntu-latest

    steps:
      - name: Check out tag
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build standalone executable
        run: |
          bun build ./local-code-review.mjs \
            --compile \
            --minify \
            --target=bun-linux-x64 \
            --outfile lcr
          chmod +x lcr

      - name: Smoke-test executable
        run: |
          file lcr
          test -x lcr

      - name: Create GitHub Release and attach executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" \
            lcr \
            --clobber
