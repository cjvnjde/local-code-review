name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  check:
    name: Test source
    runs-on: ubuntu-latest

    steps:
      - name: Check out tag
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Test and bundle
        run: |
          bun test ./src
          bun build ./src/index.ts --target=bun --outdir /tmp/lcr-check

  build:
    name: Build ${{ matrix.platform }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x64
            target: bun-linux-x64
            executable: lcr
            package: lcr-linux-x64.tar.gz
          - platform: Linux ARM64
            target: bun-linux-arm64
            executable: lcr
            package: lcr-linux-arm64.tar.gz
          - platform: macOS x64
            target: bun-darwin-x64
            executable: lcr
            package: lcr-macos-x64.tar.gz
          - platform: macOS ARM64
            target: bun-darwin-arm64
            executable: lcr
            package: lcr-macos-arm64.tar.gz
          - platform: Windows x64
            target: bun-windows-x64
            executable: lcr.exe
            package: lcr-windows-x64.zip

    steps:
      - name: Check out tag
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build standalone executable
        env:
          TARGET: ${{ matrix.target }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          mkdir -p build
          bun build ./src/index.ts \
            --compile \
            --minify \
            --target="$TARGET" \
            --outfile "build/$EXECUTABLE"
          test -s "build/$EXECUTABLE"
          file "build/$EXECUTABLE"

      - name: Package executable
        env:
          EXECUTABLE: ${{ matrix.executable }}
          PACKAGE: ${{ matrix.package }}
        run: |
          mkdir -p dist
          if [[ "$PACKAGE" == *.zip ]]; then
            (cd build && zip "../dist/$PACKAGE" "$EXECUTABLE")
          else
            chmod +x "build/$EXECUTABLE"
            tar -C build -czf "dist/$PACKAGE" "$EXECUTABLE"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.package }}
          path: dist/${{ matrix.package }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release and attach packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
