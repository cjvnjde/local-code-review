name: Quality checks

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Format, lint, types, tests, and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check source
        run: bun run check

  browser:
    name: Standalone browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install Chrome and browser dependencies
        run: bunx playwright install --with-deps chrome

      - name: Test source browser integrations
        env:
          LCR_TEST_BROWSER: "1"
        run: bun test ./src

      - name: Test the compiled executable outside the checkout
        run: bun run test:browser tests/browser/review.spec.ts --forbid-only

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-failure-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
